# Rendered by the official nginx entrypoint, replacing only SITE_DOMAIN/CMS_DOMAIN.
# Domains must be bare DNS names. nginx runtime variables retain their dollar signs.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name ${SITE_DOMAIN};
    return 308 https://${SITE_DOMAIN}$request_uri;
}
server {
    listen 80;
    server_name ${CMS_DOMAIN};
    return 308 https://${CMS_DOMAIN}$request_uri;
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
}
server {
    listen 443 ssl;
    server_name ${SITE_DOMAIN};
    ssl_certificate /etc/nginx/tls/site/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/site/privkey.pem;
    include /etc/nginx/security-headers.conf;
    client_max_body_size 64k;
    location / {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://web:3000;
    }
}
server {
    listen 443 ssl;
    server_name ${CMS_DOMAIN};
    ssl_certificate /etc/nginx/tls/cms/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/cms/privkey.pem;
    include /etc/nginx/security-headers.conf;
    client_max_body_size 25m;
    # Only the internal Next server may call the signed inquiry submission API.
    location ~ ^/api/inquiries/submit(?:/|$) { return 403; }
    location / {
        include /etc/nginx/proxy-common.conf;
        proxy_pass http://cms:1337;
    }
}
