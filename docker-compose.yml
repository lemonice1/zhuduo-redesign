name: modular-housing-production

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  cms:
    image: modular-housing-cms:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
      args:
        PUBLIC_URL: https://${CMS_DOMAIN:?Set CMS_DOMAIN}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://${CMS_DOMAIN:?Set CMS_DOMAIN}
      IS_PROXIED: "true"
      MAX_IPS_COUNT: 1
      APP_KEYS: ${APP_KEYS:?Set APP_KEYS}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?Set API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?Set TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      STRAPI_SERVER_TOKEN: ${STRAPI_SERVER_TOKEN:?Set STRAPI_SERVER_TOKEN}
      SEED_DEMO_CONTENT: "false"
      AUTO_TRANSLATE_ENABLED: ${AUTO_TRANSLATE_ENABLED:-false}
      AUTO_TRANSLATE_API_URL: ${AUTO_TRANSLATE_API_URL:-}
      AUTO_TRANSLATE_API_KEY: ${AUTO_TRANSLATE_API_KEY:-}
      AUTO_TRANSLATE_MODEL: ${AUTO_TRANSLATE_MODEL:-}
      AUTO_TRANSLATE_TIMEOUT_MS: ${AUTO_TRANSLATE_TIMEOUT_MS:-30000}
      STRAPI_TELEMETRY_DISABLED: "true"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:?Set S3_REGION}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_ROOT_PATH: ${S3_ROOT_PATH:-}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:?Set HTTPS MEDIA_PUBLIC_URL}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
    networks: [database, application]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:1337/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 10

  web:
    image: modular-housing-web:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      STRAPI_PUBLIC_URL: http://cms:1337
      STRAPI_SERVER_TOKEN: ${STRAPI_SERVER_TOKEN:?Set STRAPI_SERVER_TOKEN}
      TRUST_PROXY: "true"
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    networks: [application]
    depends_on:
      cms: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  nginx:
    image: nginx:1.30.5-alpine3.24
    # Official entrypoint renders templates before this command; remove bundled demo site.
    command: [sh, -c, "rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN:?Set CMS_DOMAIN}
      NGINX_ENVSUBST_FILTER: '^(SITE_DOMAIN|CMS_DOMAIN)$'
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/site.conf:/etc/nginx/templates/site.conf.template:ro
      - ./deploy/nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./deploy/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ${TLS_CERTS_DIR:?Set absolute TLS_CERTS_DIR}:/etc/nginx/tls:ro
    networks: [application]
    depends_on:
      web: { condition: service_healthy }
      cms: { condition: service_healthy }

volumes:
  postgres_production_data:
networks:
  database:
    internal: true
  application:
    driver: bridge
